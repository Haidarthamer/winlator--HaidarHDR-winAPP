name: Build and Release APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/Winlator-HaidarHDR-debug.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             release/Winlator-HaidarHDR-debug.apk             --title "Winlator HaidarHDR Build $GITHUB_RUN_NUMBER"             --notes "Automatic APK build from commit $GITHUB_SHA"             --target "$GITHUB_SHA"
